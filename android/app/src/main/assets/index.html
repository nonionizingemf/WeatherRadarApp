<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOAA Weather Dash</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>:root{font-family:Segoe UI,Arial,sans-serif;color:#eaf2f8;background:#091017;--p:#111b23;--l:#263744;--m:#90a3b2;--a:#55b6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#142532,#080c10 60%);min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom, 0px))}.app{scroll-padding-bottom:96px}.app{max-width:1280px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.brand{font-size:18px;font-weight:700}.sub{font-size:11px;color:var(--m)}button,select,input{background:#0f1820;color:#e5eef4;border:1px solid var(--l);border-radius:8px;padding:8px 10px;font-size:12px}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.btn.active{background:#11283a;border-color:#3d89ba}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(290px,.8fr);gap:10px}.panel{background:rgba(15,23,31,.96);border:1px solid var(--l);border-radius:12px;overflow:hidden;box-shadow:0 14px 50px #0007}.mapwrap{position:relative;height:620px}.map{width:100%;height:100%;background:#071016}.maptag{position:absolute;z-index:500;top:10px;left:10px;background:#071016dc;border-radius:8px;padding:7px 9px;font-size:11px}.status{position:absolute;z-index:500;top:10px;right:10px;background:#071016dc;border-radius:8px;padding:7px 9px;font-size:11px}.side{padding:12px}.place{font-weight:650}.temp{font-size:40px;font-weight:750;margin:4px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.metric{padding:9px;border:1px solid var(--l);border-radius:9px;background:#0d151c}.k{font-size:10px;color:var(--m)}.v{font-size:16px;font-weight:700;margin-top:2px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip.active{background:#184765;border-color:#55b6ff;box-shadow:inset 0 0 0 1px #55b6ff}.btn.active{background:#184765!important;border-color:#55b6ff;box-shadow:inset 0 0 0 1px #55b6ff}.timeline{padding:10px 12px;border-top:1px solid var(--l)}.tlrow{display:flex;align-items:center;gap:8px}.range{width:100%}.tlmarks{display:flex;justify-content:space-between;font-size:10px;color:var(--m);margin-top:5px}.forecast{color:#ffd27a}.settings{display:none;padding:10px;border-top:1px solid var(--l)}.settings.show{display:block}.settings-row{display:flex;gap:8px;flex-wrap:wrap}.hours{display:flex;overflow:auto;border-top:1px solid var(--l);margin-top:10px;padding-bottom:8px;scrollbar-width:thin}.hourlypanel{scroll-margin-bottom:110px}.hour{min-width:112px;padding:9px;border-right:1px solid var(--l)}.hour.active{background:#12344a;box-shadow:inset 0 0 0 1px #55b6ff}.mini{font-size:11px;margin-top:3px}.small{font-size:10px;color:var(--m);margin-top:4px}.err{min-height:18px;color:#ffabab;font-size:11px;margin-top:8px}@media(max-width:850px){.layout{grid-template-columns:1fr}.mapwrap{height:440px}}
</style></head><body><div class="app"><div class="top"><div><div class="brand">NOAA Weather Dash · Android</div><div class="sub">Interactive radar · observed history · short-range nowcast · current + hourly weather · v2.0.6</div></div><div class="toolbar"><button class="btn active" id="radarBtn">RADAR</button><button class="btn" id="hourBtn">HOURLY</button><button class="btn" id="setBtn">SETTINGS</button></div></div>
<div class="layout"><section class="panel"><div class="mapwrap"><div id="map" class="map"></div><div class="maptag" id="radarTag">RADAR · loading</div><div class="status" id="radarStatus">loading…</div></div><div class="timeline"><div class="tlrow"><button id="play">▶</button><input class="range" id="timeline" type="range" min="0" max="0" value="0"><button id="latest">Latest</button></div><div class="tlmarks"><span id="past">Past</span><span id="cursor">—</span><span id="future" class="forecast">Nowcast</span></div></div></section>
<aside class="panel side"><div class="place" id="place">Grand Rapids, MI</div><div class="temp" id="temp">--°F</div><div id="condition" class="sub">Loading…</div><div class="sub" id="stamp">—</div><div class="metrics"><div class="metric"><div class="k">DAY HIGH / LOW</div><div class="v" id="hiLo">-- / --</div></div><div class="metric"><div class="k">HUMIDITY</div><div class="v" id="humidity">--%</div></div><div class="metric"><div class="k">WIND</div><div class="v" id="wind">--</div></div><div class="metric"><div class="k">RADAR FRAME</div><div class="v" id="age">--</div></div></div><div class="chips"><button class="chip active" data-src="open">Open-Meteo</button><button class="chip active" data-src="nws">NOAA/NWS</button></div><div id="compare" class="sub" style="margin-top:9px"></div><div class="err" id="err"></div><div class="timeline" style="margin:12px -12px -12px"><b>Radar source</b><div class="chips"><button class="chip active" id="rainBtn">RainViewer composite</button><button class="chip" id="noaaBtn">NOAA MRMS fallback</button></div></div></aside></div>
<div class="panel hourlypanel" id="hourly" style="margin-top:10px"><div style="padding:10px 12px"><b>Hourly</b><div class="hours" id="hours"></div></div><div class="settings" id="settings"><div class="settings-row"><label>U.S. ZIP <input id="zip" inputmode="numeric" maxlength="5" placeholder="49503"></label><button id="useZip">Use ZIP</button></div><div class="settings-row" style="margin-top:8px"><label>Lat <input id="lat" type="number" step="0.0001"></label><label>Lon <input id="lon" type="number" step="0.0001"></label><label>Radar site <input id="site" maxlength="4"></label><button id="save">Save & refresh</button></div></div></div>
</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>
const $=x=>document.getElementById(x);const S={lat:+localStorage.lat||42.9634,lon:+localStorage.lon||-85.6681,zip:localStorage.zip||'',placeLabel:localStorage.placeLabel||'',site:(localStorage.site||'KGRR').toUpperCase(),source:'rain',weather:new Set(['open','nws']),frames:[],frame:0,playing:false,timer:null,map:null,radarLayer:null,base:null};$('lat').value=S.lat;$('lon').value=S.lon;$('zip').value=S.zip;$('site').value=S.site;
function fmt(v){return v==null?'--':Math.round(v)}function wx(code){return ({0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm',96:'Thunderstorm + hail',99:'Thunderstorm + hail'})[code]||'Conditions'}
function mapInit(){S.map=L.map('map',{zoomControl:true,preferCanvas:false,minZoom:2,maxZoom:12}).setView([S.lat,S.lon],8);S.base=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap contributors'}).addTo(S.map)}
async function loadRain(){try{$('radarStatus').textContent='loading radar timeline…';const r=await fetch('https://api.rainviewer.com/public/weather-maps.json');if(!r.ok)throw new Error('RainViewer metadata failed');const j=await r.json();const p=(j.radar&&j.radar.past)||[];const n=(j.radar&&j.radar.nowcast)||[];S.rainFrames=[...p.map(x=>({t:x.time,path:x.path,kind:'past',source:'rain'})),...n.map(x=>({t:x.time,path:x.path,kind:'future',source:'rain'}))];buildTimeline();$('radarStatus').textContent='radar timeline ready';}catch(e){$('radarStatus').textContent='timeline unavailable';$('err').textContent='Radar: '+e.message}}
function buildTimeline(){const now=Math.floor(Date.now()/1000);const start=now-4*3600;const noaa=[];for(let t=Math.ceil(start/300)*300;t<=now;t+=300)noaa.push({t,kind:t<=now?'past':'future',source:'noaa'});const rf=S.rainFrames||[];const future=rf.filter(f=>f.kind==='future');S.frames=S.source==='rain'?rf:[...noaa,...future];$('timeline').max=Math.max(0,S.frames.length-1);let i=S.frames.length-1;for(let k=0;k<S.frames.length;k++)if(S.frames[k].t>=now){i=Math.max(0,k-1);break}renderFrame(i)}
function renderFrame(i){if(!S.frames.length)return;i=Math.max(0,Math.min(i,S.frames.length-1));S.frame=i;const f=S.frames[i];if(S.radarLayer)S.map.removeLayer(S.radarLayer);if(f.source==='rain'){const url='https://tilecache.rainviewer.com'+f.path+'/256/{z}/{x}/{y}/2/1_1.png';S.radarLayer=L.tileLayer(url,{opacity:.72,tileSize:256,minNativeZoom:2,maxNativeZoom:7,minZoom:2,maxZoom:12,zIndex:20,attribution:'Radar by RainViewer',updateWhenZooming:false,keepBuffer:2}).addTo(S.map);$('radarTag').textContent=f.kind==='future'?'RainViewer nowcast':'RainViewer radar composite';}else{noaaTimeOverlay(f.t*1000)}$('timeline').value=i;$('cursor').textContent=new Date(f.t*1000).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});$('age').textContent=f.kind==='future'?'NOWCAST':(f.t>=Date.now()/1000-600?'latest':'historical')}
function noaaTimeOverlay(timeMs){const b=S.map.getBounds(),sw=b.getSouthWest(),ne=b.getNorthEast();const p1=L.CRS.EPSG3857.project(sw),p2=L.CRS.EPSG3857.project(ne);const size=Math.min(1400,Math.max(700,Math.floor(S.map.getSize().x*1.5)))+','+Math.min(1000,Math.max(500,Math.floor(S.map.getSize().y*1.5)));const u='https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity_time/ImageServer/exportImage?bbox='+encodeURIComponent(p1.x+','+p1.y+','+p2.x+','+p2.y)+'&bboxSR=3857&imageSR=3857&size='+size+'&time='+encodeURIComponent(String(timeMs))+'&format=png32&transparent=true&f=image';S.radarLayer=L.imageOverlay(u,b,{opacity:.78,interactive:false,attribution:'NOAA MRMS'}).addTo(S.map);$('radarStatus').textContent='NOAA MRMS timeline';$('radarTag').textContent='NOAA MRMS · 4-hour history';}
function noaaFallback(){const t=S.frames[S.frame]?S.frames[S.frame].t:Math.floor(Date.now()/1000);noaaTimeOverlay(t*1000)}
async function openM(){const u=`https://api.open-meteo.com/v1/forecast?latitude=${S.lat}&longitude=${S.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation_probability,precipitation,rain,showers,snowfall,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=2`;const r=await fetch(u);if(!r.ok)throw Error('Open-Meteo failed');return r.json()}
async function nws(){const p=await fetch(`https://api.weather.gov/points/${S.lat},${S.lon}`);if(!p.ok)throw Error('NWS points failed');const pj=await p.json();const h=await fetch(pj.properties.forecastHourly);if(!h.ok)throw Error('NWS hourly failed');return {point:pj.properties,hours:(await h.json()).properties.periods}}
async function lookupZip(z){z=(z||'').replace(/\D/g,'');if(!/^\d{5}$/.test(z))throw Error('Enter a valid 5-digit U.S. ZIP code');const r=await fetch('https://api.zippopotam.us/us/'+z);if(!r.ok)throw Error('ZIP code not found');const j=await r.json();const place=j.places&&j.places[0];if(!place)throw Error('ZIP code not found');return {lat:+place.latitude,lon:+place.longitude,label:place['place name']+', '+place['state abbreviation']};}
function renderHourly(d){const times=d.hourly.time;const currentMs=new Date(d.current.time).getTime();let idx=0,best=Infinity;for(let i=0;i<times.length;i++){const diff=Math.abs(new Date(times[i]).getTime()-currentMs);if(diff<best){best=diff;idx=i}}const start=Math.max(0,idx-1),end=Math.min(times.length,start+24);$('hours').innerHTML=times.slice(start,end).map((t,j)=>{const i=start+j,isCurrent=i===idx;const pp=d.hourly.precipitation_probability ? d.hourly.precipitation_probability[i] : null;const mm=d.hourly.precipitation ? d.hourly.precipitation[i] : null;let type='';if((d.hourly.snowfall ? d.hourly.snowfall[i] : 0||0)>0)type='Snow';else if((d.hourly.showers ? d.hourly.showers[i] : 0||0)>0)type='Showers';else if((d.hourly.rain ? d.hourly.rain[i] : 0||0)>0)type='Rain';return `<div class="hour${isCurrent?' active':''}"><b>${isCurrent?'Now':new Date(t).toLocaleTimeString([], {hour:'numeric'})}</b><div class="mini">${fmt(d.hourly.temperature_2m[i])}° · ${fmt(d.hourly.relative_humidity_2m[i])}%</div><div class="small">💧 ${fmt(pp)}% · ${mm==null?'--':Number(mm*0.0393701).toFixed(2)}"</div><div class="small">${type||'Dry'} · 💨 ${fmt(d.hourly.wind_speed_10m[i])} mph</div></div>`}).join('')}
function renderOpen(d){const c=d.current;$('place').textContent=S.placeLabel||`${S.lat.toFixed(3)}, ${S.lon.toFixed(3)}`;$('temp').textContent=`${fmt(c.temperature_2m)}°F`;$('condition').textContent=wx(c.weather_code);$('stamp').textContent='Open-Meteo · '+new Date(c.time).toLocaleString();$('humidity').textContent=fmt(c.relative_humidity_2m)+'%';$('wind').textContent=fmt(c.wind_speed_10m)+' mph';$('hiLo').textContent=`${fmt(d.daily.temperature_2m_max[0])} / ${fmt(d.daily.temperature_2m_min[0])}°`;renderHourly(d)}
function renderNws(d){const x=d.hours[0];$('compare').innerHTML=`NOAA/NWS: ${x?x.temperature+'°'+x.temperatureUnit:'--'} · ${x?x.shortForecast:'—'}`}
async function refresh(){if(S.weather.has('open'))openM().then(renderOpen).catch(e=>$('err').textContent=e.message);if(S.weather.has('nws'))nws().then(renderNws).catch(e=>$('err').textContent=e.message)}
$('useZip').onclick=async()=>{try{$('err').textContent='';const z=$('zip').value.trim();const r=await lookupZip(z);S.zip=z;S.lat=r.lat;S.lon=r.lon;S.placeLabel=r.label;localStorage.zip=z;localStorage.lat=S.lat;localStorage.lon=S.lon;localStorage.placeLabel=S.placeLabel;$('lat').value=S.lat;$('lon').value=S.lon;$('place').textContent=r.label;S.map.setView([S.lat,S.lon],8);refresh();loadRain()}catch(e){$('err').textContent=e.message}};$('play').onclick=()=>{S.playing=!S.playing;$('play').textContent=S.playing?'❚❚':'▶';$('play').classList.toggle('active',S.playing);if(S.playing){S.timer=setInterval(()=>{let n=S.frame+1;if(n>=S.frames.length){S.playing=false;clearInterval(S.timer);$('play').textContent='▶';$('play').classList.remove('active');return}renderFrame(n)},900)}else clearInterval(S.timer)};$('timeline').oninput=e=>renderFrame(+e.target.value);$('latest').onclick=()=>{if(S.source==='noaa'){let i=S.frames.length-1;for(let k=S.frames.length-1;k>=0;k--)if(S.frames[k].source==='noaa'){i=k;break}renderFrame(i);return}const i=S.frames.map(f=>f.kind).lastIndexOf('future');renderFrame(i<0?S.frames.length-1:i)};function setRadarSource(src){S.source=src;$('rainBtn').classList.toggle('active',src==='rain');$('noaaBtn').classList.toggle('active',src==='noaa');$('timeline').disabled=false;$('play').disabled=false;if(src==='rain'){loadRain()}else{buildTimeline()}}$('rainBtn').onclick=()=>setRadarSource('rain');$('noaaBtn').onclick=()=>setRadarSource('noaa');$('setBtn').onclick=()=>{$('settings').classList.toggle('show');$('setBtn').classList.toggle('active',$('settings').classList.contains('show'));$('setBtn').setAttribute('aria-pressed',$('settings').classList.contains('show'));};$('save').onclick=()=>{S.lat=+$('lat').value;S.lon=+$('lon').value;S.site=$('site').value.toUpperCase();localStorage.lat=S.lat;localStorage.lon=S.lon;localStorage.site=S.site;S.map.setView([S.lat,S.lon],8);refresh();loadRain()};$('hourBtn').onclick=()=>{$('hourly').scrollIntoView({behavior:'smooth'});$('hourBtn').classList.add('active');setTimeout(()=>$('hourBtn').classList.remove('active'),1200);};document.querySelectorAll('.chip[data-src]').forEach(b=>b.onclick=()=>{b.classList.toggle('active');b.classList.contains('active')?S.weather.add(b.dataset.src):S.weather.delete(b.dataset.src);refresh()});mapInit();loadRain();refresh();S.map.on('moveend',()=>{if(S.source==='noaa'&&S.frames[S.frame]){if(S.frames[S.frame].source==='noaa')noaaTimeOverlay(S.frames[S.frame].t*1000);}});setInterval(refresh,600000);setInterval(()=>{if(S.source==='rain')loadRain()},300000);
</script></body></html>
